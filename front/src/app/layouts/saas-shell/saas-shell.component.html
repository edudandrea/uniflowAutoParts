<main class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      @if (!logoUnavailable()) {
        <img src="/logo-uniflow-autoparts.png" alt="UniFlow AutoParts" (error)="logoUnavailable.set(true)" />
      } @else {
        <div class="mini-mark">UF</div>
      }
    </div>

    <nav aria-label="Menu SaaS">
      <a class="nav-item" routerLink="/saas/empresas" routerLinkActive="active">
        <span class="nav-icon">E</span>
        Empresas
      </a>
      <a class="nav-item" routerLink="/saas/usuarios" routerLinkActive="active">
        <span class="nav-icon">U</span>
        Usuarios
      </a>
    </nav>
  </aside>

  <section class="admin-content">
    <header class="topbar">
      <div>
        <p>Administrador SaaS</p>
        <h1>Ola, {{ auth.usuario()?.nome }}!</h1>
      </div>
      <div class="topbar-actions">
        <input type="search" placeholder="Buscar por empresa, usuario, e-mail..." />
        <button type="button" class="ghost-button" (click)="sair()">Sair</button>
      </div>
    </header>

    <section class="metrics-grid" aria-label="Resumo SaaS">
      <article class="metric-card green">
        <span>Empresas</span>
        <strong>{{ companiesStore.empresas().length }}</strong>
        <small>contratantes cadastradas</small>
      </article>
      <article class="metric-card blue">
        <span>Status</span>
        <strong>Ativo</strong>
        <small>ambiente SaaS liberado</small>
      </article>
      <article class="metric-card teal">
        <span>Bootstrap</span>
        <strong>OK</strong>
        <small>admin SaaS configurado</small>
      </article>
    </section>

    <router-outlet />
  </section>
</main>
