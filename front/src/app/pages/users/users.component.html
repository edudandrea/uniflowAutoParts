<section class="workspace-grid">
  <article class="panel wide">
    <div class="panel-header">
      <div>
        <p>Usuarios</p>
        <h2>Cadastro de usuario</h2>
      </div>
    </div>

    <form [formGroup]="usuarioForm" (ngSubmit)="cadastrarUsuario()" class="admin-form user-form">
      <label>
        <span>Empresa</span>
        <select formControlName="empresaId">
          <option value="">Selecione</option>
          @for (empresa of companiesStore.empresas(); track empresa.id) {
            <option [value]="empresa.id">{{ empresa.nomeFantasia }}</option>
          }
        </select>
      </label>
      <label>
        <span>Nome</span>
        <input type="text" formControlName="nome" />
      </label>
      <label>
        <span>E-mail</span>
        <input type="email" formControlName="email" />
      </label>
      <label>
        <span>Senha</span>
        <input type="password" formControlName="senha" />
      </label>
      <label>
        <span>Perfil</span>
        <select formControlName="perfil">
          <option value="3">Operador</option>
          <option value="2">Administrador da empresa</option>
        </select>
      </label>

      @if (message()) {
        <p class="message admin-message">{{ message() }}</p>
      }

      <button class="primary-button form-action" type="submit" [disabled]="loading()">
        {{ loading() ? 'Salvando...' : 'Cadastrar usuario' }}
      </button>
    </form>
  </article>

  <article class="panel">
    <div class="panel-header">
      <div>
        <p>Contexto</p>
        <h2>Empresas disponiveis</h2>
      </div>
    </div>
    <div class="company-list">
      @for (empresa of companiesStore.empresas(); track empresa.id) {
        <div class="company-item">
          <strong>{{ empresa.nomeFantasia }}</strong>
          <span>{{ empresa.razaoSocial }}</span>
          <small>{{ empresa.cnpj }}</small>
        </div>
      } @empty {
        <p class="empty-text">Cadastre uma empresa antes de criar usuarios.</p>
      }
    </div>
  </article>
</section>
